<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #181b24;
    --card-hover: #1f2330;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8b91a3;
    --accent: #6c8cff;
    --up: #3ecf8e;
    --down: #f2555a;
    --unknown: #8b91a3;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --card-hover: #f0f2f7;
      --border: #dde0e8;
      --text: #1b1e27;
      --muted: #6a7083;
      --accent: #3b5bdb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.5rem; }
  header .sub { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
  .tools { display: flex; gap: .5rem; align-items: center; }
  input[type=search] {
    width: 260px;
    padding: .55rem .8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: .95rem;
  }
  button {
    padding: .55rem .9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: .9rem;
  }
  button:hover { background: var(--card-hover); }
  main { padding: 1.5rem 2rem 3rem; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 2rem; }
  section h2 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 .75rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .6rem;
    padding: 1rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); }
  .card .top { display: flex; align-items: center; gap: .75rem; }
  .card .icon { font-size: 1.8rem; line-height: 1; }
  .card .name { font-weight: 600; font-size: 1.05rem; }
  .card .desc { color: var(--muted); font-size: .85rem; }
  .card a.main::after { content: ""; position: absolute; inset: 0; }
  .card a.main { color: inherit; text-decoration: none; }
  .card .url { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; color: var(--accent); }
  .card .links { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: auto; }
  .card .links a {
    position: relative;
    z-index: 1;
    font-size: .78rem;
    padding: .2rem .55rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
  }
  .card .links a:hover { color: var(--text); border-color: var(--accent); }
  .status {
    margin-left: auto;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--unknown);
    flex-shrink: 0;
  }
  .status.up { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .status.down { background: var(--down); }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 2rem; }
  kbd {
    font-family: ui-monospace, Menlo, monospace;
    font-size: .75rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 .3rem;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏠 Homelab</h1>
    <div class="sub" id="clock"></div>
  </div>
  <div class="tools">
    <input type="search" id="search" placeholder="Filter services…  ( / )" autocomplete="off">
    <button id="refresh" title="Re-check reachability">↻ Check</button>
  </div>
</header>

<main id="main"></main>

<footer>
  Status dot = reachable from this browser (green), unreachable (red), checking (grey).
  Press <kbd>/</kbd> to filter, <kbd>Enter</kbd> to open the first match.
  <br>Services are defined in <code>docker-compose.yml</code> — keep this page in sync when adding one.
</footer>

<script>
  // Host running the Nextcloud AIO interface (port 8999). When this page is
  // opened as a local file, set this to the homelab server's IP or hostname.
  const AIO_HOST = location.hostname || "localhost";

  const SERVICES = [
    {
      category: "Media & Knowledge",
      items: [
        { name: "Immich", icon: "📸", desc: "Photo & video library", url: "https://photos.home.com", doc: "immich.md" },
        { name: "Mealie", icon: "🍲", desc: "Recipe manager", url: "https://recipes.home.com", doc: "mealie.md" },
        { name: "Booklore", icon: "📚", desc: "Book tracking", url: "https://books.home.com", doc: "booklore.md" },
      ],
    },
    {
      category: "Storage & Collaboration",
      items: [
        {
          name: "Nextcloud", icon: "☁️", desc: "Files, calendar, contacts", url: "https://office.home.com", doc: "nextcloud.md",
          extra: [{ label: "AIO admin", url: `https://${AIO_HOST}:8999` }],
        },
      ],
    },
    {
      category: "Home Automation",
      items: [
        { name: "Home Assistant", icon: "💡", desc: "Smart home hub", url: "https://ha.home.com", doc: "homeassistant.md" },
      ],
    },
    {
      category: "Networking & Security",
      items: [
        {
          name: "Authentik", icon: "🔐", desc: "Identity provider / SSO", url: "https://auth.home.com", doc: "authentik.md",
          extra: [{ label: "Admin", url: "https://auth.home.com/if/admin/" }],
        },
        {
          name: "Pi-hole", icon: "🛡️", desc: "DNS ad blocking", url: "https://pihole.home.com/admin/", doc: "pihole.md",
        },
        {
          name: "Traefik", icon: "🔀", desc: "Reverse proxy", url: "https://traefik.home.com/dashboard/", doc: "traefik.md",
        },
      ],
    },
    {
      category: "Monitoring",
      items: [
        { name: "Dozzle", icon: "📜", desc: "Container logs & stats", url: "https://monitor.home.com", doc: "dozzle.md" },
      ],
    },
  ];

  const main = document.getElementById("main");
  const cards = [];

  for (const group of SERVICES) {
    const section = document.createElement("section");
    section.innerHTML = `<h2>${group.category}</h2><div class="grid"></div>`;
    const grid = section.querySelector(".grid");

    for (const s of group.items) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.search = `${s.name} ${s.desc} ${s.url} ${group.category}`.toLowerCase();
      const extra = (s.extra || []).map(e => `<a href="${e.url}" target="_blank" rel="noopener">${e.label}</a>`).join("");
      card.innerHTML = `
        <div class="top">
          <span class="icon">${s.icon}</span>
          <a class="main" href="${s.url}" target="_blank" rel="noopener"><span class="name">${s.name}</span></a>
          <span class="status" title="Checking…"></span>
        </div>
        <div class="desc">${s.desc}</div>
        <div class="url">${new URL(s.url).host}</div>
        <div class="links">
          <a href="${s.doc}" target="_blank" rel="noopener">📄 Docs</a>
          ${extra}
        </div>`;
      grid.appendChild(card);
      cards.push({ el: card, section, service: s });
    }
    main.appendChild(section);
  }

  // Reachability check: a no-cors request resolves (opaque) if the host answers
  // and rejects on DNS/connection/TLS failure. It cannot see HTTP status codes.
  async function check({ el, service }) {
    const dot = el.querySelector(".status");
    dot.className = "status";
    dot.title = "Checking…";
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      await fetch(service.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
      dot.classList.add("up");
      dot.title = "Reachable";
    } catch {
      dot.classList.add("down");
      dot.title = "Unreachable (offline, DNS, or certificate not trusted)";
    } finally {
      clearTimeout(timer);
    }
  }
  const checkAll = () => cards.forEach(check);
  document.getElementById("refresh").addEventListener("click", checkAll);
  checkAll();
  setInterval(checkAll, 60000);

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    for (const c of cards) c.el.classList.toggle("hidden", q && !c.el.dataset.search.includes(q));
    for (const sec of main.querySelectorAll("section")) {
      sec.classList.toggle("hidden", !sec.querySelector(".card:not(.hidden)"));
    }
  });
  search.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const first = cards.find(c => !c.el.classList.contains("hidden"));
      if (first) window.open(first.service.url, "_blank", "noopener");
    } else if (e.key === "Escape") {
      search.value = "";
      search.dispatchEvent(new Event("input"));
      search.blur();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== search) {
      e.preventDefault();
      search.focus();
    }
  });

  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = new Date().toLocaleString(undefined, {
    weekday: "long", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
  tick();
  setInterval(tick, 30000);
</script>
</body>
</html>
