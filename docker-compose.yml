name: homelab

networks:
  homelab:
    name: homelab-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.1.0/24

volumes:
  database:
    driver: local
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
    driver: local
  model-cache:
    driver: local

services:
  reverse-proxy:
    # The official v3 Traefik docker image
    image: traefik:v3.6
    pull_policy: always
    hostname: proxy
    restart: unless-stopped
    environment:
      TZ: America/Toronto
    # Enables the web UI and tells Traefik to listen to docker
    command:
      - --api=true
      - --api.disabledashboardad=true
      - --log.format=json
      - --log.level=DEBUG
      - --providers.docker
      - --providers.docker.exposedbydefault=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --providers.file.filename=/etc/traefik/tls.yml
#      - --metrics.prometheus=true
#      - --metrics.prometheus.addEntryPointsLabels=true
#      - --metrics.prometheus.addServicesLabels=true
    deploy:
      resources:
        limits:
          memory: 128mb
    ports:
      # The HTTP port
      - "80:80"
      # The HTTPS port
      - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.home.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Add the following label
      - "traefik.http.routers.dashboard.tls=true"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #      - ./volumes/traefik/tls.yml:/etc/traefik/tls.yml:ro # Traefik TLS configuration
      - ./volumes/traefik/tlsmkcert.yml:/etc/traefik/tls.yml:ro # Traefik TLS configuration with mkcert
      - ./volumes/traefik/certs:/etc/ssl/traefik:ro # SSL certificates
    networks:
      - homelab

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    pull_policy: always
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: 'America/Toronto'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: ${SUPER_SECRET_PASSWORD}
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
#      FTLCONF_dns_hosts: |-
#        127.0.0.1 mylocal
#        192.168.4.232 traefik.home.com pihole.home.com
      FTLCONF_misc_etc_dnsmasq_d: true
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - ./volumes/pihole/etc:/etc/pihole
      - ./volumes/pihole/dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.pihole.rule=Host(`pihole.home.com`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    networks:
      - homelab

  # PostgreSQL for Authentik
  authentik-db:
    image: postgres:17-alpine
    container_name: authentik-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-changeme}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authentik" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Authentik
  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped
    networks:
      - homelab
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentik Server
  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.12.1}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-changeme}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      TZ: America/Toronto
    volumes:
      - ./volumes/authentik/data:/data
      - ./volumes/authentik/custom-templates:/templates
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.authentik.rule=Host(`auth.home.com`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    networks:
      - homelab

  # Authentik Worker
  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.12.1}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-changeme}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      TZ: America/Toronto
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/authentik/data:/data
      - ./volumes/authentik/certs:/certs
      - ./volumes/authentik/custom-templates:/templates
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - homelab

  # Home Assistant
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    environment:
      TZ: America/Toronto
    volumes:
      - ./volumes/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.homeassistant.rule=Host(`ha.home.com`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
    networks:
      - homelab

  # Nextcloud AIO mastercontainer
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    init: true
    container_name: nextcloud-aio-mastercontainer
    restart: unless-stopped
    environment:
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 0.0.0.0
      APACHE_ADDITIONAL_NETWORK: homelab-network
      NEXTCLOUD_DATADIR: ${NEXTCLOUD_DATADIR:-./volumes/nextcloud/data}

      SKIP_DOMAIN_VALIDATION: true
      TZ: America/Toronto
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8999:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.nextcloud.rule=Host(`office.home.com`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.url=http://nextcloud-aio-apache:11000"
      - "traefik.http.middlewares.nc-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.nc-secure-headers.headers.hostsProxyHeaders=X-Forwarded-Host"
      - "traefik.http.middlewares.nc-secure-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.nc-chain.chain.middlewares=nc-redirect,nc-secure-headers"
      - "traefik.http.routers.nextcloud-https.middlewares=nc-chain"
    networks:
      - homelab

  # Immich PostgreSQL Database
  immich-postgres:
    image: tensorchord/pgvecto-rs:pg17-v0.4.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:-changeme}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./volumes/immich/postgres:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Immich Redis
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Immich Server
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:-changeme}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      TZ: America/Toronto
      UPLOAD_LOCATION: ./volumes/immich/library
    volumes:
      - ./volumes/immich/library:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab-network"
      - "traefik.http.routers.immich.rule=Host(`photos.home.com`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    networks:
      - homelab

  # Immich Machine Learning
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      TZ: America/Toronto
    volumes:
      - model-cache:/cache
    networks:
      - homelab

